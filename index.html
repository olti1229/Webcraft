<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Standoff 2 Radar</title>
    <style>
        body {
            background-color: #0a0f1e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .radar-container {
            background: #1a1f2e;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            border: 1px solid #2a3f5e;
        }
        canvas {
            background: #0f1422;
            border-radius: 50%;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 0 2px #2a3f5e, 0 0 0 5px #0f1422;
        }
        .info {
            text-align: center;
            margin-top: 15px;
            color: #7aa2f7;
            font-weight: bold;
        }
        .controls {
            text-align: center;
            margin-top: 15px;
        }
        button {
            background: #2a3f5e;
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            margin: 0 5px;
        }
        button:hover {
            background: #3a5f8e;
        }
        input {
            background: #0f1422;
            border: 1px solid #2a3f5e;
            color: white;
            padding: 8px;
            border-radius: 8px;
            width: 250px;
        }
    </style>
</head>
<body>
<div class="radar-container">
    <canvas id="radarCanvas" width="500" height="500"></canvas>
    <div class="info">
        <div id="playerCount">Игроков на радаре: 0</div>
        <div class="controls" style="margin-top: 10px;">
            <input type="text" id="lobbyLink" placeholder="Вставьте ссылку лобби здесь" style="width: 300px;">
            <button id="activateBtn">Активировать радар</button>
            <button id="testBtn">Тестовые данные</button>
        </div>
        <div style="font-size: 12px; margin-top: 10px;">
            🟢 Вы &nbsp;|&nbsp; 🔴 Террористы &nbsp;|&nbsp; 🔵 Спецназ
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('radarCanvas');
    const ctx = canvas.getContext('2d');
    const size = 500;
    const center = size / 2;
    
    let players = [
        // Демо-данные: x, y, команда (1 - терр, 2 - спецназ), здоровье
        {x: 120, z: 100, team: 1, health: 100, alive: true},
        {x: -80, z: 150, team: 1, health: 75, alive: true},
        {x: 200, z: -50, team: 2, health: 100, alive: true},
        {x: -150, z: -120, team: 2, health: 45, alive: true},
        {x: 50, z: 80, team: 1, health: 30, alive: true}
    ];
    
    let localPlayer = {x: 0, z: 0};
    let radarActive = false;
    
    function worldToRadar(worldX, worldZ) {
        // Преобразование мировых координат в координаты радара
        let dx = worldX - localPlayer.x;
        let dz = worldZ - localPlayer.z;
        let distance = Math.sqrt(dx*dx + dz*dz);
        let maxDistance = 800; // Максимальная дальность отображения
        
        if (distance > maxDistance) return null;
        
        let scale = center / maxDistance;
        let radarX = center + dx * scale;
        let radarZ = center + dz * scale;
        
        return {x: radarX, z: radarZ};
    }
    
    function drawRadar() {
        // Очистка
        ctx.fillStyle = '#0f1422';
        ctx.fillRect(0, 0, size, size);
        
        // Рисуем концентрические круги
        ctx.strokeStyle = '#2a3f5e';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 3; i++) {
            ctx.beginPath();
            ctx.arc(center, center, (size/2) * (i/3), 0, Math.PI * 2);
            ctx.stroke();
        }
        
        // Рисуем линии направления
        ctx.beginPath();
        ctx.moveTo(center, 0);
        ctx.lineTo(center, size);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, center);
        ctx.lineTo(size, center);
        ctx.stroke();
        
        // Рисуем игроков
        for (let player of players) {
            if (!player.alive) continue;
            
            let pos = worldToRadar(player.x, player.z);
            if (!pos) continue;
            
            // Цвет в зависимости от команды
            let color;
            if (player.team === 1) color = '#ff4444'; // Террористы
            else if (player.team === 2) color = '#4444ff'; // Спецназ
            else color = '#ffffff';
            
            // Размер зависит от здоровья
            let size = 6 + (player.health / 100) * 4;
            
            ctx.beginPath();
            ctx.arc(pos.x, pos.z, size, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            ctx.stroke();
            
            // Отображаем здоровье
            ctx.fillStyle = '#ffffff';
            ctx.font = '10px Arial';
            ctx.fillText(player.health + '%', pos.x - 10, pos.z - 5);
        }
        
        // Рисуем центральную точку (локальный игрок)
        ctx.beginPath();
        ctx.arc(center, center, 8, 0, Math.PI * 2);
        ctx.fillStyle = '#44ff44';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.stroke();
        
        // Рисуем направление взгляда (треугольник вверх)
        ctx.beginPath();
        ctx.moveTo(center, center - 15);
        ctx.lineTo(center - 5, center - 5);
        ctx.lineTo(center + 5, center - 5);
        ctx.fillStyle = '#44ff44';
        ctx.fill();
        
        document.getElementById('playerCount').innerText = `Игроков на радаре: ${players.length}`;
    }
    
    // Анимация
    function animate() {
        drawRadar();
        requestAnimationFrame(animate);
    }
    
    // Активация радара
    document.getElementById('activateBtn').addEventListener('click', function() {
        let link = document.getElementById('lobbyLink').value.trim();
        if (link) {
            alert('Ссылка получена: ' + link + '\nРадар активирован! (Демо-режим)');
        } else {
            alert('Пожалуйста, вставьте ссылку лобби');
        }
        radarActive = true;
    });
    
    // Тестовые данные для демонстрации
    document.getElementById('testBtn').addEventListener('click', function() {
        // Генерируем случайных игроков для демонстрации
        players = [];
        let teams = [1, 1, 2, 2, 1, 2];
        for (let i = 0; i < 12; i++) {
            players.push({
                x: (Math.random() - 0.5) * 600,
                z: (Math.random() - 0.5) * 600,
                team: teams[i % teams.length],
                health: Math.floor(Math.random() * 100) + 1,
                alive: true
            });
        }
        // Локальный игрок в центре
        localPlayer = {x: 0, z: 0};
        alert('Тестовые данные загружены!');
    });
    
    animate();
</script>
</body>
</html>
